<script>
  (function () {
    // Segmented tab toggle logic
    const tabParticipant = document.getElementById('tab-participant');
    const tabHost = document.getElementById('tab-host');

    function setActiveTab(activeEl, inactiveEl) {
      activeEl.className = 'flex-1 py-2 px-3 rounded-full bg-electric-blue text-on-primary font-label-md text-label-md text-center shadow-[0_2px_10px_rgba(29,100,242,0.35)] transition-all flex items-center justify-center gap-1 active:scale-98';
      inactiveEl.className = 'flex-1 py-2 px-3 rounded-full text-on-surface-variant font-label-md text-label-md text-center hover:text-on-surface transition-all flex items-center justify-center gap-1 active:scale-98';
    }

    if (tabParticipant && tabHost) {
      tabParticipant.addEventListener('click', () => setActiveTab(tabParticipant, tabHost));
      tabHost.addEventListener('click', () => setActiveTab(tabHost, tabParticipant));
    }

    // Refresh countdown simulation
    const timerEl = document.getElementById('qr-timer');
    const refreshBtn = document.getElementById('btn-refresh-qr');
    const refreshIcon = document.getElementById('refresh-icon');
    let timeLeft = 28;

    setInterval(() => {
      timeLeft = timeLeft <= 1 ? 30 : timeLeft - 1;
      if (timerEl) timerEl.textContent = timeLeft;
    }, 1000);

    if (refreshBtn && refreshIcon) {
      refreshBtn.addEventListener('click', () => {
        refreshIcon.classList.add('animate-spin');
        timeLeft = 30;
        if (timerEl) timerEl.textContent = timeLeft;
        setTimeout(() => refreshIcon.classList.remove('animate-spin'), 650);
      });
    }

    // Interactive feedback buttons selection
    const buttons = document.querySelectorAll('.feedback-btn');
    buttons.forEach((btn) => {
      btn.addEventListener('click', () => {
        const group = btn.dataset.group;
        const siblings = document.querySelectorAll(`.feedback-btn[data-group="${group}"]`);
        siblings.forEach((s) => {
          s.dataset.active = 'false';
          s.className = 'feedback-btn flex items-center justify-center gap-2 py-3 px-3 rounded-xl bg-surface-container-low text-on-surface-variant hover:bg-surface-container active:scale-98 transition-all';
          const icon = s.querySelector('.material-symbols-outlined');
          if (icon) icon.className = 'material-symbols-outlined text-[18px] text-outline';
          const label = s.querySelector('span:last-child');
          if (label) label.className = 'font-label-md text-label-md';
        });

        btn.dataset.active = 'true';
        if (group === 'q1') {
          btn.className = 'feedback-btn flex items-center justify-center gap-2 py-3 px-3 rounded-xl bg-status-active-green-soft text-status-active-green shadow-sm active:scale-98 transition-all';
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon) icon.className = 'material-symbols-outlined text-[18px] text-status-active-green font-bold';
        } else {
          btn.className = 'feedback-btn flex items-center justify-center gap-2 py-3 px-3 rounded-xl bg-party-violet-soft text-party-violet shadow-sm active:scale-98 transition-all';
          const icon = btn.querySelector('.material-symbols-outlined');
          if (icon) icon.className = 'material-symbols-outlined text-[18px] text-party-violet font-bold';
        }
        const label = btn.querySelector('span:last-child');
        if (label) label.className = 'font-label-md text-label-md font-bold';
      });
    });

    // Action CTA click bounce
    const nextBtn = document.getElementById('btn-next-round');
    if (nextBtn) {
      nextBtn.addEventListener('click', () => {
        nextBtn.classList.add('scale-95');
        setTimeout(() => nextBtn.classList.remove('scale-95'), 180);
      });
    }
  })();
</script></main>

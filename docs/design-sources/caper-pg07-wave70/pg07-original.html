<!-- Micro-interactions Script -->
<script>
    function toggleHeart(btn) {
      const icon = btn.querySelector('.material-symbols-outlined');
      const countSpan = btn.querySelector('.reaction-count');
      let count = parseInt(countSpan.innerText, 10);
      
      const isLiked = btn.classList.contains('bg-party-pink-soft');
      if (isLiked) {
        btn.classList.remove('bg-party-pink-soft', 'text-party-pink');
        btn.classList.add('bg-surface-container', 'text-outline');
        icon.style.fontVariationSettings = "'FILL' 0";
        countSpan.innerText = Math.max(0, count - 1);
      } else {
        btn.classList.remove('bg-surface-container', 'text-outline');
        btn.classList.add('bg-party-pink-soft', 'text-party-pink');
        icon.style.fontVariationSettings = "'FILL' 1";
        countSpan.innerText = count + 1;
      }
    }

    function handleSendMessage() {
      const input = document.getElementById('comment-input');
      if (input && input.value.trim() !== '') {
        input.value = '';
        input.placeholder = '已发送，等待主办方回应～';
        setTimeout(() => {
          input.placeholder = '提一个问题...';
        }, 2400);
      }
    }

name: R1 CI

'on':
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 11.19.0
          runtime: node@24.19.0
          require-lockfile: true
          cache: true
      - name: Typecheck
        run: pnpm typecheck
      - name: Test
        run: pnpm test
      - name: Dependency audit
        run: pnpm audit --audit-level high
